{#- Small card: photo + name only. Expects `p` with id, name and image_url. -#}
{% from "_icons.html" import icon %}
<a class="product-card" href="{{ url_for('product_page', product_id=p.id) }}">
  <span class="product-card-image">
    {%- if p.image_url %}
      <img src="{{ p.image_url }}" alt="" loading="lazy">
    {%- else %}
      {{ icon("package", 32) }}
    {%- endif %}
  </span>
  <span class="product-card-name">{{ p.name }}</span>
</a>
