<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     role="img" aria-label="Monitor de Preços">
  <title>Monitor de Preços</title>
  <!-- Rounded badge with a falling price line: the drop is the point of the project.
       The colors follow the reader's light/dark preference, like the site does. -->
  <style>
    .badge { fill: #0f7a5c; }
    .line  { stroke: #ffffff; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .dot   { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .badge { fill: #3fbf93; }
      .line  { stroke: #0b1f18; }
      .dot   { fill: #0b1f18; }
    }
  </style>
  <rect class="badge" width="32" height="32" rx="8"/>
  <polyline class="line" points="7,12 13,18 18,13 24.5,20.5"/>
  <circle class="dot" cx="24.5" cy="20.5" r="2.8"/>
</svg>
